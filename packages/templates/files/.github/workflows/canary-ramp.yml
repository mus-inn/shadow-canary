name: Canary ramp (SLO-gated)

# Runs every 15 min on the default branch. Reads the canary state from Edge
# Config; if a canary is in progress (pct < 100), hits the SLO endpoint on the
# new prod deploy twice (30s apart). Both 200 → bump; any failure → rollback
# to 0% and Slack-notify.
#
# Ramp curve (Europe/Paris):
#   - before 12:00 → cap at 20% (soft start, night-time safety)
#   - from  12:00 → step up to 100% (reaches 100 by ~17:00)
#   - step = +4 percentage points per tick

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Shared concurrency group with deploy-prod.yml + deploy-shadow.yml:
# serializes deploy + bump on the same Edge Config key so the
# read-modify-write cycle can't race.
concurrency:
  group: shadow-canary-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ramp:
    runs-on: ubuntu-latest
    # Force `shell: bash` so every `run:` step gets
    # `bash --noprofile --norc -eo pipefail {0}` instead of the default
    # `bash -e {0}` (no pipefail). See deploy-shadow.yml for the
    # historical incident this defends against.
    defaults:
      run:
        shell: bash
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EDGE_CONFIG_ID: ${{ secrets.VERCEL_EDGE_CONFIG_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # GitHub injects GITHUB_REPOSITORY ("owner/repo") into every step by
      # default; we restate it here so the derivation still works if someone
      # later scopes env at the step level or containerizes the job.
      GITHUB_REPOSITORY: ${{ github.repository }}
      STEP: '4'
    steps:
      - name: Derive SHADOW_CANARY_KEY from repo slug
        # Scheduled events don't populate github.event.repository.name, so we
        # parse GITHUB_REPOSITORY ("owner/repo") in a shell step to stay
        # correct across schedule + workflow_dispatch. The middleware reads
        # the same slug from VERCEL_GIT_REPO_SLUG, so the key is deterministic
        # on both sides.
        run: |
          REPO_SLUG="${GITHUB_REPOSITORY##*/}"
          echo "SHADOW_CANARY_KEY=shadow-${REPO_SLUG}-canary" >> "$GITHUB_ENV"
          echo "Derived SHADOW_CANARY_KEY=shadow-${REPO_SLUG}-canary"

      - name: Read current canary state from Edge Config
        id: state
        run: |
          # Same defensive read pattern as deploy-shadow.yml /
          # deploy-prod.yml — `curl -sf | jq` without HTTP code capture
          # silently produces an empty / partial result on transient API
          # failures. With pipefail (now active via job-level
          # `shell: bash`) the pipe failure would propagate, but the cron
          # runs 96×/day so even a 99.9% reliable API would fail this step
          # several times per quarter; capturing the HTTP code is the
          # right defense to avoid spurious skips and noisy ::error::
          # cascades for benign transients.
          EDGE_FILE="${RUNNER_TEMP}/edge-config-${GITHUB_RUN_ID}-state.json"
          trap 'rm -f "$EDGE_FILE"' EXIT

          HTTP=$(curl -s -o "$EDGE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            || echo '000')
          case "$HTTP" in
            200)
              if ! jq -e . "$EDGE_FILE" >/dev/null 2>&1; then
                echo "::error::Edge Config read returned 200 but body is not valid JSON — refusing to read state from a corrupted response."
                exit 1
              fi
              VALUE=$(jq --arg key "$SHADOW_CANARY_KEY" \
                '[.[] | select(.key == $key)] | .[0].value // {}' "$EDGE_FILE")
              ;;
            *)
              echo "::error::Edge Config read failed (HTTP $HTTP) — refusing to read state from a failed response."
              exit 1
              ;;
          esac

          PROD_URL=$(echo "$VALUE" | jq -r '.deploymentDomainProd // empty')
          PREV_URL=$(echo "$VALUE" | jq -r '.deploymentDomainProdPrevious // empty')
          PCT=$(echo "$VALUE" | jq -r '.trafficProdCanaryPercent // 100')
          PAUSED=$(echo "$VALUE" | jq -r '.canaryPaused // false')

          {
            echo "value<<EOF"
            echo "$VALUE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"
          echo "prev_url=$PREV_URL" >> "$GITHUB_OUTPUT"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "paused=$PAUSED" >> "$GITHUB_OUTPUT"
          echo "Canary state → pct=$PCT, paused=$PAUSED, prod=$PROD_URL, prev=$PREV_URL"

      - name: Skip if no canary in progress or paused by operator
        id: gate
        env:
          PCT: ${{ steps.state.outputs.pct }}
          PROD_URL: ${{ steps.state.outputs.prod_url }}
          PAUSED: ${{ steps.state.outputs.paused }}
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "No deploymentDomainProd yet — nothing to canary. Exiting."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PCT" = "100" ]; then
            echo "Canary already at 100% — nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PAUSED" = "true" ]; then
            echo "Canary paused by operator via admin UI — skipping bump."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Run 2 SLO checks (30s apart) on new prod
        id: slo
        if: steps.gate.outputs.skip == '0'
        env:
          PROD_URL: ${{ steps.state.outputs.prod_url }}
        run: |
          URL="${PROD_URL}/api/slo"
          case "$URL" in http*) ;; *) URL="https://$URL" ;; esac

          SLO_BODY_FILE="${RUNNER_TEMP}/slo-body-${GITHUB_RUN_ID}.txt"
          trap 'rm -f "$SLO_BODY_FILE"' EXIT

          OK=0
          LAST_BODY=""
          for i in 1 2; do
            CODE=$(curl -s -o "$SLO_BODY_FILE" -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            BODY=$(cat "$SLO_BODY_FILE" 2>/dev/null || true)
            # Trim to 500 chars, strip newlines/CR for YAML-safe single-line output.
            # 500 gives enough room to show a full JSON payload or a truncated
            # stack trace without blowing the Edge Config 8 KB per-item cap
            # (10 entries × 500 B ≈ 5 KB, plus the rest of ShadowConfig).
            BODY_TRIMMED="$(echo "${BODY:0:500}" | tr '\n\r' '  ')"
            echo "SLO check $i → HTTP $CODE :: $BODY_TRIMMED"
            if [ "$CODE" = "200" ]; then OK=$((OK + 1)); fi
            echo "code$i=$CODE" >> "$GITHUB_OUTPUT"
            LAST_BODY="$BODY_TRIMMED"
            if [ "$i" = "1" ]; then sleep 30; fi
          done

          # Use the multiline-safe <<EOF form so any remaining oddball chars in
          # the body don't break $GITHUB_OUTPUT parsing.
          {
            echo "body_excerpt<<EOF_BODY"
            echo "$LAST_BODY"
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

          if [ "$OK" = "2" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next percent (Europe/Paris time-gated cap)
        id: compute
        if: steps.gate.outputs.skip == '0' && steps.slo.outputs.ok == '1'
        env:
          CURRENT: ${{ steps.state.outputs.pct }}
        run: |
          HOUR=$(TZ=Europe/Paris date +%-H)
          if [ "$HOUR" -lt 12 ]; then CAP=20; else CAP=100; fi
          NEXT=$((CURRENT + STEP))
          if [ "$NEXT" -gt "$CAP" ]; then NEXT=$CAP; fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"
          echo "Bump: $CURRENT → $NEXT (step=$STEP, cap=$CAP at ${HOUR}h Europe/Paris)"

      - name: Apply bump
        if: steps.gate.outputs.skip == '0' && steps.slo.outputs.ok == '1'
        env:
          NEXT: ${{ steps.compute.outputs.next }}
          CURRENT_VALUE: ${{ steps.state.outputs.value }}
        run: |
          # At 100%, keep deploymentDomainProdPrevious in place so in-flight
          # sessions assigned to 'prod-previous' can finish there. The key is
          # only rotated by the next deploy-prod run. canaryStartedAt cleared
          # because the canary is no longer "in progress" for UI purposes.
          if [ "$NEXT" -ge 100 ]; then
            MERGED=$(echo "$CURRENT_VALUE" | jq '. + {trafficProdCanaryPercent: 100, canaryStartedAt: null}')
          else
            MERGED=$(echo "$CURRENT_VALUE" | jq --argjson pct "$NEXT" '. + {trafficProdCanaryPercent: $pct}')
          fi
          curl -sS -X PATCH \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --argjson v "$MERGED" --arg key "$SHADOW_CANARY_KEY" '{items:[{operation:"upsert",key:$key,value:$v}]}')"

      - name: Notify Slack — canary reached 100%
        if: >
          steps.gate.outputs.skip == '0' &&
          steps.slo.outputs.ok == '1' &&
          steps.compute.outputs.next == '100' &&
          env.SLACK_WEBHOOK_URL != ''
        env:
          PROD_URL: ${{ steps.state.outputs.prod_url }}
        run: |
          TEXT=":white_check_mark: Canary reached 100% on \`${PROD_URL}\` — new users go straight to new prod; in-flight sessions on previous finish there until next deploy."
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TEXT" '{text: $t}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Rollback to 0% on SLO failure
        if: steps.gate.outputs.skip == '0' && steps.slo.outputs.ok == '0'
        env:
          CURRENT_VALUE: ${{ steps.state.outputs.value }}
        run: |
          # Pause too so the cron doesn't auto-recover on a transient SLO flake —
          # a human should look at Sentry and Resume via /admin if safe.
          MERGED=$(echo "$CURRENT_VALUE" | jq '. + {trafficProdCanaryPercent: 0, canaryPaused: true}')
          curl -sS -X PATCH \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --argjson v "$MERGED" --arg key "$SHADOW_CANARY_KEY" '{items:[{operation:"upsert",key:$key,value:$v}]}')"

      - name: Notify Slack — SLO failure (rolled back)
        if: >
          steps.gate.outputs.skip == '0' &&
          steps.slo.outputs.ok == '0' &&
          env.SLACK_WEBHOOK_URL != ''
        env:
          PCT: ${{ steps.state.outputs.pct }}
          PROD_URL: ${{ steps.state.outputs.prod_url }}
        run: |
          TEXT=":rotating_light: Canary rolled back to 0% on \`$PROD_URL\` (was ${PCT}%). SLO failed — all prod traffic back on previous deploy. Check Sentry."
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TEXT" '{text: $t}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Record SLO check in Edge Config (ring buffer, last 10)
        # Runs on both pass and fail paths (not on skip) so the admin UI has a
        # trail of recent checks to diagnose "why isn't the canary moving?".
        if: steps.gate.outputs.skip == '0'
        env:
          OK: ${{ steps.slo.outputs.ok }}
          PCT_BEFORE: ${{ steps.state.outputs.pct }}
          NEXT_PCT: ${{ steps.compute.outputs.next }}
          CODE1: ${{ steps.slo.outputs.code1 }}
          CODE2: ${{ steps.slo.outputs.code2 }}
          BODY: ${{ steps.slo.outputs.body_excerpt }}
        run: |
          if [ "$OK" = "1" ]; then
            PCT_AFTER="$NEXT_PCT"
          else
            PCT_AFTER="0"
          fi
          OK_BOOL=$( [ "$OK" = "1" ] && echo true || echo false )

          # Re-read the current Edge Config value because the bump/rollback
          # step just mutated it — we want to merge sloChecks on top of the
          # fresh post-bump state, not overwrite the pct the previous step set.
          # Same HTTP-capture pattern as the initial state read: a transient
          # API failure here would otherwise have FRESH collapse to {} and
          # the upsert would clobber every key except sloChecks. Worse than
          # the deploy-* clobber path because this runs 96×/day on the cron.
          EDGE_FILE="${RUNNER_TEMP}/edge-config-${GITHUB_RUN_ID}-fresh.json"
          trap 'rm -f "$EDGE_FILE"' EXIT

          HTTP=$(curl -s -o "$EDGE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            || echo '000')
          case "$HTTP" in
            200)
              if ! jq -e . "$EDGE_FILE" >/dev/null 2>&1; then
                echo "::error::Edge Config re-read returned 200 but body is not valid JSON — refusing to write sloChecks against a corrupted response."
                exit 1
              fi
              FRESH=$(jq --arg key "$SHADOW_CANARY_KEY" \
                '[.[] | select(.key == $key)] | .[0].value // {}' "$EDGE_FILE")
              if [ -z "$FRESH" ] || [ "$FRESH" = "null" ]; then FRESH='{}'; fi
              ;;
            *)
              echo "::error::Edge Config re-read failed (HTTP $HTTP) — refusing to write sloChecks against empty state to avoid clobbering deploymentDomainProd / deploymentDomainProdPrevious / trafficProdCanaryPercent."
              exit 1
              ;;
          esac

          ENTRY=$(jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson ok "$OK_BOOL" \
            --argjson code1 "$CODE1" \
            --argjson code2 "$CODE2" \
            --arg body "$BODY" \
            --argjson pctBefore "$PCT_BEFORE" \
            --argjson pctAfter "$PCT_AFTER" \
            '{ts: $ts, ok: $ok, codes: [$code1, $code2], bodyExcerpt: $body, pctBefore: $pctBefore, pctAfter: $pctAfter}')

          MERGED=$(echo "$FRESH" | jq --argjson entry "$ENTRY" '. + {sloChecks: (([$entry] + (.sloChecks // [])) | .[0:10])}')

          curl -sS -X PATCH \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --argjson v "$MERGED" --arg key "$SHADOW_CANARY_KEY" '{items:[{operation:"upsert",key:$key,value:$v}]}')"

      - name: Notify Slack on workflow failure
        # ::error:: is invisible outside the GitHub Actions UI. Without
        # this step, a transient API outage during a cron tick would
        # silently fail and nobody would notice — the next tick 15 min
        # later would just succeed if the API recovered.
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TEXT=":rotating_light: Workflow \`${WORKFLOW}\` failed on \`${REPO}\` — see https://github.com/${REPO}/actions/runs/${RUN_ID}"
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TEXT" '{text: $t}')" \
            "$SLACK_WEBHOOK_URL"
