name: Deploy shadow (master → shadow slot, 1% traffic)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EDGE_CONFIG_ID: ${{ secrets.VERCEL_EDGE_CONFIG_ID }}
      # Key is deterministic: derived from the repo slug on both sides.
      # Middleware reads VERCEL_GIT_REPO_SLUG (auto-injected by Vercel);
      # this workflow uses github.event.repository.name. Same value, same
      # key — no secret to drift out of sync.
      #
      # NOTE: github.event.repository.name is populated for push/dispatch
      # events but NOT for schedule events — see canary-ramp.yml for the
      # schedule-safe shell variant if you ever add `on: schedule:` here.
      SHADOW_CANARY_KEY: shadow-${{ github.event.repository.name }}-canary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy shadow (Vercel builds remotely so VERCEL_DEPLOYMENT_ID
                              is set during next build → Skew Protection
                              injects ?dpl=<id> on static assets so
                              cross-deploy asset fetches via the prod domain
                              resolve to this deploy)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --skip-domain --token=$VERCEL_TOKEN)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "New shadow deploy: $DEPLOY_URL"

      - name: Resolve current Vercel production deployment (bootstrap-only)
        # Used solely to bootstrap `deploymentDomainProd` on the FIRST shadow
        # deploy of a brand-new Edge Config — never to overwrite an existing
        # value (deploy-prod.yml + /api/admin/rollback own that field after
        # bootstrap). Reads the Vercel project's `targets.production` (the
        # deployment currently aliased to the custom domain by `vercel
        # promote`), which is the only honest source of "what's serving prod
        # right now" we have access to from this workflow. Falls back to empty
        # if the project has no prod deploy yet (greenfield) — leaving the
        # field unset is strictly better than seeding it with the shadow URL
        # (the historical hérésie this workflow used to commit).
        id: prod
        run: |
          PROJECT=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            || echo '{}')
          PROD_HOST=$(echo "$PROJECT" | jq -r '.targets.production.url // empty')
          if [ -n "$PROD_HOST" ]; then
            echo "url=https://$PROD_HOST" >> "$GITHUB_OUTPUT"
            echo "Current Vercel prod target: https://$PROD_HOST"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "No targets.production on Vercel — deploymentDomainProd will stay unset until deploy-prod.yml runs."
          fi

      - name: Merge new shadow URL into shadow config
        run: |
          CURRENT=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            | jq --arg key "$SHADOW_CANARY_KEY" '[.[] | select(.key == $key)] | .[0].value // {}' \
            || echo '{}')
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then CURRENT='{}'; fi

          MERGED=$(echo "$CURRENT" | jq \
            --arg shadowUrl "${{ steps.deploy.outputs.url }}" \
            --arg prodUrl "${{ steps.prod.outputs.url }}" \
            '. as $cur
            | (
                # Prepend the outgoing shadow URL to history iff it exists
                # and differs from the incoming one. Dedupe while preserving
                # order (keeps the FIRST occurrence, which is the most
                # recent). Trim to 20 — matches the admin UI rollback picker.
                # Commit metadata (sha/ref/ts) is fetched on-demand by the
                # admin UI from the Vercel API, so history stays compact.
                if ($cur.deploymentDomainShadow // "") != "" and $cur.deploymentDomainShadow != $shadowUrl then
                  ([$cur.deploymentDomainShadow] + ($cur.shadowHistory // []))
                    | reduce .[] as $x ([]; if any(. == $x) then . else . + [$x] end)
                    | .[0:20]
                else
                  ($cur.shadowHistory // [])
                end
              ) as $history
            # Bootstrap-only patch for deploymentDomainProd: write the Vercel
            # current-prod URL ONLY when the field is empty. Never overrides
            # a value already set by deploy-prod.yml or the rollback admin
            # action — that field is owned by the prod path, this workflow
            # is read-only on it after first init.
            | (
                if ($cur.deploymentDomainProd // "") == "" and ($prodUrl | length) > 0 then
                  {deploymentDomainProd: $prodUrl}
                else
                  {}
                end
              ) as $prodBootstrap
            | . + $prodBootstrap + {
              shadowHistory: $history,
              # Deprecated: kept populated for back-compat with v0.4.x admin
              # UIs reading the old field. Remove in v0.5.
              deploymentDomainShadowPrevious: ($history[0] // null),
              deploymentDomainShadow: $shadowUrl,
              trafficShadowPercent: (.trafficShadowPercent // 1),
              trafficProdCanaryPercent: (.trafficProdCanaryPercent // 100),
              shadowForceIPs: (.shadowForceIPs // [])
            }')

          curl -sS -X PATCH \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --argjson v "$MERGED" --arg key "$SHADOW_CANARY_KEY" '{items:[{operation:"upsert",key:$key,value:$v}]}')"
