name: Deploy prod (production → start canary ramp)

# Commit markers (mutually exclusive — skip wins):
#   [skip-canary]  → promote to 100% immediately, no ramp, clear previous
#   [keep-canary]  → replace new prod but keep pct/previous/startedAt so the
#                    ramp continues from where it was (fix-in-place during a
#                    canary without restarting at 0%)
# Same effect via workflow_dispatch inputs skip_canary / keep_canary.

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      skip_canary:
        description: 'Promote directly to 100% (no canary ramp)'
        type: boolean
        default: false
      keep_canary:
        description: 'Replace new prod but keep the current ramp state'
        type: boolean
        default: false

# Serialize with deploy-shadow.yml and canary-ramp.yml on the same Edge
# Config key: deploy + bump must not race on the read-modify-write cycle.
concurrency:
  group: shadow-canary-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Force `shell: bash` so every `run:` step gets
    # `bash --noprofile --norc -eo pipefail {0}` instead of the default
    # `bash -e {0}` (no pipefail). See deploy-shadow.yml for the
    # incident this defends against.
    defaults:
      run:
        shell: bash
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EDGE_CONFIG_ID: ${{ secrets.VERCEL_EDGE_CONFIG_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Key is deterministic: derived from the repo slug on both sides.
      # Middleware reads VERCEL_GIT_REPO_SLUG (auto-injected by Vercel);
      # this workflow uses github.event.repository.name. Same value, same
      # key — no secret to drift out of sync.
      #
      # NOTE: github.event.repository.name is populated for push/dispatch
      # events but NOT for schedule events — see canary-ramp.yml for the
      # schedule-safe shell variant if you ever add `on: schedule:` here.
      SHADOW_CANARY_KEY: shadow-${{ github.event.repository.name }}-canary
      SKIP_CANARY: ${{ contains(github.event.head_commit.message, '[skip-canary]') || inputs.skip_canary == true }}
      KEEP_CANARY: ${{ contains(github.event.head_commit.message, '[keep-canary]') || inputs.keep_canary == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy production (Vercel builds remotely so VERCEL_DEPLOYMENT_ID
                                  is available during next build → Skew
                                  Protection injects ?dpl=<id> on static assets)
        id: deploy
        run: |
          # `vercel deploy` reads VERCEL_TOKEN from env; passing
          # --token=$VERCEL_TOKEN would expose it via /proc/<pid>/cmdline.
          DEPLOY_URL=$(vercel deploy --prod --skip-domain)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "New prod deploy: $DEPLOY_URL"

      - name: Update Edge Config (canary ramp or direct promote)
        # Edge Config is updated BEFORE `vercel promote` (next step) on
        # purpose: if Edge Config write fails (transient API error), we
        # exit before touching the custom-domain alias, leaving the
        # previous prod deploy serving traffic and Edge Config consistent
        # with what's actually aliased. Re-running the workflow then
        # creates a fresh Vercel deploy and retries the whole sequence
        # idempotently. The previous order (promote then PATCH) could
        # leave the custom domain pointing at a deploy not referenced in
        # Edge Config when the PATCH failed — visible only as a stale
        # admin UI, not a paged outage.
        id: edge
        env:
          # Move the deploy URL out of the GitHub-Actions templating layer
          # into a real env var so jq receives it via "$NEW_URL" instead
          # of having ${{ ... }} interpolated into the heredoc — defends
          # against any malformed Vercel URL ever escaping the bash
          # quoting and executing on the runner.
          NEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Same defensive read as deploy-shadow.yml — `curl -sf … | jq …
          # || echo '{}'` swallowed transient Vercel API failures and let
          # the subsequent merge clobber every existing key with `// fallback`
          # defaults (e.g. trafficProdCanaryPercent reset to 100 mid-canary,
          # deploymentDomainProdPrevious dropped, …). HTTP code capture +
          # case + hard exit on non-200 means a flaky API blocks the deploy
          # instead of corrupting Edge Config silently.
          EDGE_FILE="${RUNNER_TEMP}/edge-config-${GITHUB_RUN_ID}.json"
          trap 'rm -f "$EDGE_FILE"' EXIT

          HTTP=$(curl -s -o "$EDGE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            || echo '000')
          case "$HTTP" in
            200)
              if ! jq -e . "$EDGE_FILE" >/dev/null 2>&1; then
                echo "::error::Edge Config read returned 200 but body is not valid JSON — refusing to merge against a corrupted response."
                exit 1
              fi
              CURRENT=$(jq --arg key "$SHADOW_CANARY_KEY" \
                '[.[] | select(.key == $key)] | .[0].value // {}' "$EDGE_FILE")
              if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then CURRENT='{}'; fi
              ;;
            *)
              echo "::error::Edge Config read failed (HTTP $HTTP) — refusing to merge against empty state to avoid clobbering deploymentDomainProd / deploymentDomainProdPrevious / trafficProdCanaryPercent with defaults."
              exit 1
              ;;
          esac

          if [ "$SKIP_CANARY" = "true" ]; then
            # Operator-forced promotion. Goes straight to 100% — no previous
            # kept (no sticky tail), no startedAt, canary not paused.
            MODE="direct"
            MERGED=$(echo "$CURRENT" | jq \
              --arg newUrl "$NEW_URL" \
              '. + {
                deploymentDomainProd: $newUrl,
                deploymentDomainShadow: (.deploymentDomainShadow // $newUrl),
                trafficShadowPercent: (.trafficShadowPercent // 1),
                trafficProdCanaryPercent: 100,
                canaryPaused: false,
                shadowForceIPs: (.shadowForceIPs // [])
              } | del(.canaryStartedAt) | del(.deploymentDomainProdPrevious)')
          elif [ "$KEEP_CANARY" = "true" ]; then
            # Fix-in-place: swap the new prod URL but leave ramp state alone
            # (pct, previous, startedAt). Useful to push a correction while a
            # canary is in-flight without restarting from 0%.
            MODE="keep"
            MERGED=$(echo "$CURRENT" | jq \
              --arg newUrl "$NEW_URL" \
              '. + {
                deploymentDomainProd: $newUrl,
                deploymentDomainShadow: (.deploymentDomainShadow // $newUrl),
                trafficShadowPercent: (.trafficShadowPercent // 1),
                shadowForceIPs: (.shadowForceIPs // [])
              }')
          else
            # Bootstrap: no previous prod yet → go straight to 100%.
            # Otherwise: start canary at 0% with previous kept for traffic
            # fallback during the ramp.
            MODE="canary"
            MERGED=$(echo "$CURRENT" | jq \
              --arg newUrl "$NEW_URL" \
              --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '
              (if (.deploymentDomainProd // "") == "" then
                {deploymentDomainProd: $newUrl, trafficProdCanaryPercent: 100, canaryStartedAt: null}
              else
                {deploymentDomainProdPrevious: .deploymentDomainProd, deploymentDomainProd: $newUrl, trafficProdCanaryPercent: 0, canaryStartedAt: $startedAt}
              end)
              as $patch
              | . + $patch + {
                  deploymentDomainShadow: (.deploymentDomainShadow // $newUrl),
                  trafficShadowPercent: (.trafficShadowPercent // 1),
                  shadowForceIPs: (.shadowForceIPs // []),
                  canaryPaused: false
                }')
          fi

          curl -sS -X PATCH \
            "https://api.vercel.com/v1/edge-config/$EDGE_CONFIG_ID/items?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --argjson v "$MERGED" --arg key "$SHADOW_CANARY_KEY" '{items:[{operation:"upsert",key:$key,value:$v}]}')"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "pct=$(echo "$MERGED" | jq -r '.trafficProdCanaryPercent')" >> "$GITHUB_OUTPUT"

      - name: Promote new deploy to custom domain
        # Runs only after Edge Config has been updated successfully.
        # Order matters: if this step fails, Edge Config still references
        # this deploy URL but the alias never moved — the previous prod
        # deploy keeps serving traffic until the next workflow run. That's
        # a recoverable state (re-run the workflow). The reverse order
        # (the historical layout) could leave the alias pointing at a
        # deploy not referenced in Edge Config if PATCH failed afterward,
        # producing inconsistencies the admin UI couldn't show.
        env:
          NEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # `vercel promote` reads VERCEL_TOKEN from env; passing
          # --token=$VERCEL_TOKEN would expose it via /proc/<pid>/cmdline.
          # The URL is interpolated through env to avoid GitHub-Actions
          # templating splicing it directly into the bash command.
          vercel promote "$NEW_URL" --scope="$VERCEL_ORG_ID"

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          MODE: ${{ steps.edge.outputs.mode }}
          PCT: ${{ steps.edge.outputs.pct }}
          NEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "$MODE" = "direct" ]; then
            TEXT=":rocket: Direct promote on \`${NEW_URL}\` — \`[skip-canary]\` marker, 100% immediately, no ramp."
          elif [ "$MODE" = "keep" ]; then
            TEXT=":arrows_counterclockwise: Canary fix-in-place on \`${NEW_URL}\` — \`[keep-canary]\` marker, ramp resumes at ${PCT}%."
          elif [ "$PCT" = "100" ]; then
            TEXT=":rocket: Bootstrap production deploy \`${NEW_URL}\` — no previous prod, skipped canary (100%)."
          else
            TEXT=":traffic_light: Canary started on \`${NEW_URL}\` — 0%, ramping via cron every 15 min (Europe/Paris: cap 20% until 12:00, then up to 100%)."
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TEXT" '{text: $t}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on workflow failure
        # ::error:: is invisible outside the GitHub Actions UI. Without
        # this step a transient API outage during Edge Config write (or a
        # `vercel promote` failure after) would silently fail the deploy.
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TEXT=":rotating_light: Workflow \`${WORKFLOW}\` failed on \`${REPO}\` — see https://github.com/${REPO}/actions/runs/${RUN_ID}"
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TEXT" '{text: $t}')" \
            "$SLACK_WEBHOOK_URL"
